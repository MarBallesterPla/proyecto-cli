[project]
name = "buscafeina"
version = "1.0.0"
description = "CLI per a buscar feina a Labora, InfoJobs, Pacte Comarcal i LinkedIn"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "questionary>=2.0",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
buscafeina = "buscafeina.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["buscafeina"]
