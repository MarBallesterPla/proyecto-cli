name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Configura Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instala dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Prueba de instalación (queda disponible como comando)
        run: |
          buscafeina --help

      - name: pytest (sin red: las pruebas simulan IA y portales)
        run: pytest tests -v
