name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  proves:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Configura Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instal·la dependències
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Prova d'instal·lació (quede disponible com a comanda)
        run: |
          buscafeina --help

      - name: "pytest (sense xarxa: les proves simulen IA i portals)"
        run: pytest tests -v
